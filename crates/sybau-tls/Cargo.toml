[package]
name = "sybau-tls"
description = "SYBAU-CORE: TLS 1.3 client with browser fingerprints (uTLS templates) and REALITY"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
sybau-common.workspace = true
sybau-proto.workspace = true
anyhow.workspace = true
base64.workspace = true
brotli-decompressor = "4"
bytes.workspace = true
ed25519-dalek = "2"
flate2 = "1"
hkdf = "0.12"
hmac = "0.12"
ml-kem = "0.2"
p256 = { version = "0.13", features = ["ecdh"] }
rand.workspace = true
ruzstd = "0.7"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-webpki = "0.103"
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
tokio.workspace = true
tokio-util = { workspace = true, features = ["io"] }
tracing.workspace = true
webpki-roots = "1"
x25519-dalek = { version = "2", features = ["static_secrets"] }

[dev-dependencies]
rcgen = "0.13"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "brotli", "zlib"] }
tokio = { workspace = true, features = ["test-util"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
