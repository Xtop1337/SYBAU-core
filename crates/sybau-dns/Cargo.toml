[package]
name = "sybau-dns"
description = "SYBAU-CORE: DNS messages, upstream clients, cache and fake-ip"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
sybau-common.workspace = true
sybau-config.workspace = true
sybau-tls.workspace = true
sybau-transport.workspace = true
anyhow.workspace = true
async-trait.workspace = true
bytes.workspace = true
h3 = "0.0.8"
h3-quinn = "0.0.10"
http = "1"
parking_lot.workspace = true
quinn = { version = "0.11", default-features = false, features = ["rustls-ring", "runtime-tokio"] }
rand.workspace = true
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging"] }
tokio.workspace = true
tracing.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_Networking_WinSock"] }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
