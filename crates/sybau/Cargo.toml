[package]
name = "sybau"
description = "SYBAU-CORE"
version.workspace = true
edition.workspace = true
license.workspace = true
build = "build.rs"

[[bin]]
name = "sybau"
path = "src/main.rs"

[dependencies]
sybau-config.workspace = true
sybau-core.workspace = true
anyhow.workspace = true
serde.workspace = true
clap.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tokio-util.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_System_Threading", "Win32_Security", "Win32_System_Registry", "Win32_Networking_WinInet"] }

[build-dependencies]
winresource = "0.1"
