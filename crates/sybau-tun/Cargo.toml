[package]
name = "sybau-tun"
description = "SYBAU-CORE: TUN device, userspace TCP/IP stack, routes and kill switch"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
bytes.workspace = true
ipstack = "1"
tokio.workspace = true
tracing.workspace = true
tun-rs = { version = "2", features = ["async"] }

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_NetworkManagement_WindowsFilteringPlatform", "Win32_Networking_WinSock", "Win32_Security", "Win32_System_Rpc"] }
