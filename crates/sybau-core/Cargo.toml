[package]
name = "sybau-core"
description = "SYBAU-CORE engine: inbounds, outbounds, dispatch, statistics and control API"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
sybau-common.workspace = true
sybau-config.workspace = true
sybau-proto.workspace = true
sybau-route.workspace = true
sybau-dns.workspace = true
sybau-transport.workspace = true
anyhow.workspace = true
async-trait.workspace = true
base64.workspace = true
bytes.workspace = true
httparse.workspace = true
humantime.workspace = true
parking_lot.workspace = true
rand.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_NetworkManagement_IpHelper", "Win32_Networking_WinSock", "Win32_System_Threading"] }

[dev-dependencies]
sybau-tls.workspace = true
h2 = "0.4"
http = "1"
rcgen = "0.13"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
sha2 = "0.10"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
