[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/Xtop1337/SYBAU-core"
rust-version = "1.82"

[workspace.dependencies]
sybau-common = { path = "crates/sybau-common" }
sybau-config = { path = "crates/sybau-config" }
sybau-core = { path = "crates/sybau-core" }
sybau-proto = { path = "crates/sybau-proto" }
sybau-transport = { path = "crates/sybau-transport" }
sybau-tls = { path = "crates/sybau-tls" }
sybau-route = { path = "crates/sybau-route" }
sybau-dns = { path = "crates/sybau-dns" }

anyhow = "1"
async-trait = "0.1"
base64 = "0.22"
bytes = "1"
clap = { version = "4", features = ["derive"] }
httparse = "1"
humantime = "2"
libc = "0.2"
parking_lot = "0.12"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
socket2 = { version = "0.5", features = ["all"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "time", "sync", "macros", "signal", "fs", "process"] }
tokio-util = { version = "0.7", features = ["rt", "io"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["registry", "std"] }
windows-sys = "0.59"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
