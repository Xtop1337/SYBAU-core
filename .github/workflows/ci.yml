name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace
      - name: C API smoke test
        run: tests/ffi/run.sh

  interop:
    name: interop (official Xray and sing-box images)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build the test image
        run: docker build -f tests/interop/Dockerfile -t sybau-interop .
      - name: Run SYBAU-CORE against real Xray and sing-box
        run: docker run --rm sybau-interop

  tun-linux:
    name: TUN end-to-end (Linux network namespaces, official Xray)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p sybau
      - name: Take Xray and sing-box from the official images
        run: |
          id=$(docker create ghcr.io/xtls/xray-core:26.3.27)
          docker cp "$id:/usr/local/bin/xray" "$RUNNER_TEMP/xray"
          docker rm "$id"
          id=$(docker create ghcr.io/sagernet/sing-box:v1.14.4)
          docker cp "$id:/usr/local/bin/sing-box" "$RUNNER_TEMP/sing-box"
          docker rm "$id"
      - run: sudo apt-get install -y --no-install-recommends nftables
      - name: TUN, routes, DNS hijack, fake-ip, kill switch, exclusions, sing-box config
        run: sudo XRAY_BIN="$RUNNER_TEMP/xray" SINGBOX_BIN="$RUNNER_TEMP/sing-box" tests/tun/linux-netns.sh target/debug/sybau

  test-windows:
    runs-on: windows-latest
    # The TUN test blocks the network for a few seconds (kill switch).
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace
      - name: Official Wintun build (SHA-256 checked), embedded into sybau.exe
        shell: pwsh
        run: tests/windows/fetch-wintun.ps1 -Arch amd64
      - run: cargo build --release -p sybau
      - name: Windows smoke test (metadata, single instance, named pipe, proxying)
        shell: pwsh
        run: tests/windows/smoke.ps1 -Exe target\release\sybau.exe
      - name: Windows TUN test (Wintun, routes, uplink pinning, DNS hijack, process rules, WFP kill switch)
        shell: pwsh
        run: tests/windows/tun.ps1 -Exe target\release\sybau.exe

  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
          - { os: windows-latest, target: aarch64-pc-windows-msvc }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Official Wintun build (SHA-256 checked), embedded into the Windows binaries
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          tests/windows/fetch-wintun.ps1 -Arch $(if ("${{ matrix.target }}" -like "aarch64-*") { "arm64" } else { "amd64" })
      - run: cargo build --release --target ${{ matrix.target }} -p sybau -p sybau-ffi
      - name: Wintun license next to the binaries
        if: runner.os == 'Windows'
        shell: pwsh
        run: Copy-Item $env:SYBAU_WINTUN_LICENSE target/${{ matrix.target }}/release/wintun-LICENSE.txt
      - uses: actions/upload-artifact@v4
        with:
          name: sybau-${{ matrix.target }}
          if-no-files-found: error
          path: |
            target/${{ matrix.target }}/release/sybau
            target/${{ matrix.target }}/release/sybau.exe
            target/${{ matrix.target }}/release/sybaucore.dll
            target/${{ matrix.target }}/release/libsybaucore.so
            target/${{ matrix.target }}/release/wintun-LICENSE.txt
            include/sybau.h

  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          key: android
      - run: cargo install cargo-ndk --locked
      - name: Build libsybaucore.so for Android
        run: cargo ndk -t arm64-v8a -t armeabi-v7a -t x86_64 -o target/jniLibs build --release -p sybau-ffi
      - uses: actions/upload-artifact@v4
        with:
          name: sybau-android
          if-no-files-found: error
          path: |
            target/jniLibs
            include/sybau.h
