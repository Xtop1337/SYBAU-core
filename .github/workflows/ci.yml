name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace
      - name: C API smoke test
        run: tests/ffi/run.sh

  interop:
    name: interop (official Xray and sing-box images)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build the test image
        run: docker build -f tests/interop/Dockerfile -t sybau-interop .
      - name: Run SYBAU-CORE against real Xray and sing-box
        run: docker run --rm sybau-interop

  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace
      - run: cargo build --release -p sybau
      - name: Windows smoke test (metadata, single instance, named pipe, proxying)
        shell: pwsh
        run: tests/windows/smoke.ps1 -Exe target\release\sybau.exe

  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
          - { os: windows-latest, target: aarch64-pc-windows-msvc }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - run: cargo build --release --target ${{ matrix.target }} -p sybau -p sybau-ffi
      - uses: actions/upload-artifact@v4
        with:
          name: sybau-${{ matrix.target }}
          if-no-files-found: error
          path: |
            target/${{ matrix.target }}/release/sybau
            target/${{ matrix.target }}/release/sybau.exe
            target/${{ matrix.target }}/release/sybaucore.dll
            target/${{ matrix.target }}/release/libsybaucore.so
            include/sybau.h

  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          key: android
      - run: cargo install cargo-ndk --locked
      - name: Build libsybaucore.so for Android
        run: cargo ndk -t arm64-v8a -t armeabi-v7a -t x86_64 -o target/jniLibs build --release -p sybau-ffi
      - uses: actions/upload-artifact@v4
        with:
          name: sybau-android
          if-no-files-found: error
          path: |
            target/jniLibs
            include/sybau.h
